<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analog Clock</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .clock {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: #f8fafc;
            border: 10px solid #1f2937;
            position: relative;
            box-shadow:
                0 0 30px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        /* Clock numbers */
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #111827;
            padding-top: 15px;
        }

        .number-1 {
            transform: rotate(30deg);
        }

        .number-1 span {
            display: inline-block;
            transform: rotate(-30deg);
        }

        .number-2 {
            transform: rotate(60deg);
        }

        .number-2 span {
            display: inline-block;
            transform: rotate(-60deg);
        }

        .number-3 {
            transform: rotate(90deg);
        }

        .number-3 span {
            display: inline-block;
            transform: rotate(-90deg);
        }

        .number-4 {
            transform: rotate(120deg);
        }

        .number-4 span {
            display: inline-block;
            transform: rotate(-120deg);
        }

        .number-5 {
            transform: rotate(150deg);
        }

        .number-5 span {
            display: inline-block;
            transform: rotate(-150deg);
        }

        .number-6 {
            transform: rotate(180deg);
        }

        .number-6 span {
            display: inline-block;
            transform: rotate(-180deg);
        }

        .number-7 {
            transform: rotate(210deg);
        }

        .number-7 span {
            display: inline-block;
            transform: rotate(-210deg);
        }

        .number-8 {
            transform: rotate(240deg);
        }

        .number-8 span {
            display: inline-block;
            transform: rotate(-240deg);
        }

        .number-9 {
            transform: rotate(270deg);
        }

        .number-9 span {
            display: inline-block;
            transform: rotate(-270deg);
        }

        .number-10 {
            transform: rotate(300deg);
        }

        .number-10 span {
            display: inline-block;
            transform: rotate(-300deg);
        }

        .number-11 {
            transform: rotate(330deg);
        }

        .number-11 span {
            display: inline-block;
            transform: rotate(-330deg);
        }

        /* Clock hands */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
            transform: translateX(-50%) rotate(0deg);
        }

        .hour-hand {
            width: 8px;
            height: 85px;
            background: #111827;
            z-index: 3;
        }

        .minute-hand {
            width: 6px;
            height: 115px;
            background: #374151;
            z-index: 4;
        }

        .second-hand {
            width: 2px;
            height: 130px;
            background: #dc2626;
            z-index: 5;
        }

        /* Center of the clock */
        .center {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #dc2626;
            border: 4px solid #111827;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Minute markers */
        .marker {
            position: absolute;
            width: 4px;
            height: 12px;
            background: #374151;
            left: 50%;
            top: 5px;
            transform-origin: 50% 165px;
        }

        .marker:nth-child(1) {
            transform: translateX(-50%) rotate(6deg);
        }

        .marker:nth-child(2) {
            transform: translateX(-50%) rotate(12deg);
        }

        .marker:nth-child(3) {
            transform: translateX(-50%) rotate(18deg);
        }

        .marker:nth-child(4) {
            transform: translateX(-50%) rotate(24deg);
        }

        .marker:nth-child(5) {
            transform: translateX(-50%) rotate(36deg);
        }

        .marker:nth-child(6) {
            transform: translateX(-50%) rotate(42deg);
        }

        .marker:nth-child(7) {
            transform: translateX(-50%) rotate(48deg);
        }

        .marker:nth-child(8) {
            transform: translateX(-50%) rotate(54deg);
        }

        .marker:nth-child(9) {
            transform: translateX(-50%) rotate(66deg);
        }

        .marker:nth-child(10) {
            transform: translateX(-50%) rotate(72deg);
        }

        .marker:nth-child(11) {
            transform: translateX(-50%) rotate(78deg);
        }

        .marker:nth-child(12) {
            transform: translateX(-50%) rotate(84deg);
        }

        .marker:nth-child(13) {
            transform: translateX(-50%) rotate(96deg);
        }

        .marker:nth-child(14) {
            transform: translateX(-50%) rotate(102deg);
        }

        .marker:nth-child(15) {
            transform: translateX(-50%) rotate(108deg);
        }

        .marker:nth-child(16) {
            transform: translateX(-50%) rotate(114deg);
        }

        .marker:nth-child(17) {
            transform: translateX(-50%) rotate(126deg);
        }

        .marker:nth-child(18) {
            transform: translateX(-50%) rotate(132deg);
        }

        .marker:nth-child(19) {
            transform: translateX(-50%) rotate(138deg);
        }

        .marker:nth-child(20) {
            transform: translateX(-50%) rotate(144deg);
        }

        .marker:nth-child(21) {
            transform: translateX(-50%) rotate(156deg);
        }

        .marker:nth-child(22) {
            transform: translateX(-50%) rotate(162deg);
        }

        .marker:nth-child(23) {
            transform: translateX(-50%) rotate(168deg);
        }

        .marker:nth-child(24) {
            transform: translateX(-50%) rotate(174deg);
        }

        .marker:nth-child(25) {
            transform: translateX(-50%) rotate(186deg);
        }

        .marker:nth-child(26) {
            transform: translateX(-50%) rotate(192deg);
        }

        .marker:nth-child(27) {
            transform: translateX(-50%) rotate(198deg);
        }

        .marker:nth-child(28) {
            transform: translateX(-50%) rotate(204deg);
        }

        .marker:nth-child(29) {
            transform: translateX(-50%) rotate(216deg);
        }

        .marker:nth-child(30) {
            transform: translateX(-50%) rotate(222deg);
        }

        .marker:nth-child(31) {
            transform: translateX(-50%) rotate(228deg);
        }

        .marker:nth-child(32) {
            transform: translateX(-50%) rotate(234deg);
        }

        .marker:nth-child(33) {
            transform: translateX(-50%) rotate(246deg);
        }

        .marker:nth-child(34) {
            transform: translateX(-50%) rotate(252deg);
        }

        .marker:nth-child(35) {
            transform: translateX(-50%) rotate(258deg);
        }

        .marker:nth-child(36) {
            transform: translateX(-50%) rotate(264deg);
        }

        .marker:nth-child(37) {
            transform: translateX(-50%) rotate(276deg);
        }

        .marker:nth-child(38) {
            transform: translateX(-50%) rotate(282deg);
        }

        .marker:nth-child(39) {
            transform: translateX(-50%) rotate(288deg);
        }

        .marker:nth-child(40) {
            transform: translateX(-50%) rotate(294deg);
        }

        .marker:nth-child(41) {
            transform: translateX(-50%) rotate(306deg);
        }

        .marker:nth-child(42) {
            transform: translateX(-50%) rotate(312deg);
        }

        .marker:nth-child(43) {
            transform: translateX(-50%) rotate(318deg);
        }

        .marker:nth-child(44) {
            transform: translateX(-50%) rotate(324deg);
        }

        .marker:nth-child(45) {
            transform: translateX(-50%) rotate(336deg);
        }

        .marker:nth-child(46) {
            transform: translateX(-50%) rotate(342deg);
        }

        .marker:nth-child(47) {
            transform: translateX(-50%) rotate(348deg);
        }

        .marker:nth-child(48) {
            transform: translateX(-50%) rotate(354deg);
        }

        /* Responsive design */
        @media (max-width: 450px) {
            .clock {
                width: 280px;
                height: 280px;
            }

            .number {
                font-size: 22px;
                padding-top: 12px;
            }

            .hour-hand {
                height: 68px;
            }

            .minute-hand {
                height: 90px;
            }

            .second-hand {
                height: 105px;
            }

            .marker {
                transform-origin: 50% 130px;
            }
        }
    </style>
</head>

<body>

    <div class="clock">

        <!-- Clock numbers -->
        <div class="number number-1"><span>1</span></div>
        <div class="number number-2"><span>2</span></div>
        <div class="number number-3"><span>3</span></div>
        <div class="number number-4"><span>4</span></div>
        <div class="number number-5"><span>5</span></div>
        <div class="number number-6"><span>6</span></div>
        <div class="number number-7"><span>7</span></div>
        <div class="number number-8"><span>8</span></div>
        <div class="number number-9"><span>9</span></div>
        <div class="number number-10"><span>10</span></div>
        <div class="number number-11"><span>11</span></div>

        <div class="number" style="padding-top: 15px;">12</div>

        <!-- Minute markers -->
        <div class="marker"></div>

        <div class="marker"></div>

        <div class="marker"></div>

        <div class="marker"></div>

        <div class="marker"></div>
        <div class="marker"></div>

        <div class="marker"></div>
        <div class="marker"></div>
        <div class="marker"></div>
        <div class="marker"></div>
        <div class="marker"></div>

        <!-- Clock hands -->
        <div class="hand hour-hand" id="hour-hand"></div>
        <div class="hand minute-hand" id="minute-hand"></div>
        <div class="hand second-hand" id="second-hand"></div>

        <!-- Center -->
        <div class="center"></div>

    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            const minutes = now.getMinutes() + seconds / 60;
            const hours = (now.getHours() % 12) + minutes / 60;

            const secondDegrees =
                (seconds + milliseconds / 1000) * 6;

            const minuteDegrees =
                minutes * 6;

            const hourDegrees =
                hours * 30;

            document.getElementById("second-hand").style.transform =
                `translateX(-50%) rotate(${secondDegrees}deg)`;

            document.getElementById("minute-hand").style.transform =
                `translateX(-50%) rotate(${minuteDegrees}deg)`;

            document.getElementById("hour-hand").style.transform =
                `translateX(-50%) rotate(${hourDegrees}deg)`;
        }

        updateClock();

        setInterval(updateClock, 50);
    </script>

</body>
</html>
